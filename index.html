    desc:"🔍 名场面还原\n安陵容对甄嬛的那句 \"嬛姐姐是我唯一的光\"，就是你的日常内心戏。甄嬛今天对谁笑多了、夸了谁、和谁走得近，你全看在眼里，嘴上不提，心里已经在给 \"背叛\" 定罪。她一旦和别人热络起来，你就像安陵容看到甄嬛身边围满新人一样 —— 表面温顺，内里醋海翻腾。\n\n💥 你的真实写照\n你测出这个结果，说明你大概率是那种 \"把最好的朋友当成全世界\" 的人。你会记住她随口说过的小心愿，会把她放在朋友圈置顶，会因为她一条没秒回的消息反复自我怀疑。你不是坏，你是太怕失去，怕到用 \"占有\" 来确认 \"她还在\"。\n\n🌊 深层原因\n这种极度占有欲，往往不是因为太爱，而是因为太缺安全感。可能你在关系里吃过亏、可能你骨子里不相信自己会被坚定选择，所以你只能用 \"掌控\" 来对冲 \"被抛下\" 的恐惧。安陵容的悲剧，恰恰源于她把价值感全押在甄嬛身上。\n\n🛠️ 给现实你的建议\n① 别用冷战和阴阳怪气表达在乎，直接说 \"我今天有点吃醋了\"；② 试着发展自己的其他圈子，把一部分重心放回自己身上；③ 告诉自己：她选择留下来是爱你，不是欠你。真正的 \"唯一\" 是吸引来的，不是捆绑来的。"

    desc:"🔍 名场面还原\n朱锁锁对蒋南孙的保护，就是友情最理想的样子：你落难，我倾家荡产也要捞你；但你要走自己的路，我绝不拦你。锁锁从不会说 \"你只能有我\"，她只会说 \"我永远站你这边\"。她护她，但不绑她 —— 这份偏爱，克制又滚烫。\n\n💥 你的真实写照\n你测出这个结果，说明你属于 \"情绪稳定且爱得明白\" 的类型。你会在她低谷时兜底、撑腰，也会在她有新朋友、新恋爱时真心祝福。你在意她，但从不把 \"她必须最在乎我\" 当成友谊的及格线。你给得起空间，也给得起真心。\n\n🌊 深层原因\n你的占有欲之所以健康，是因为你的安全感不靠 \"独占\" 来维持。你相信真正的友谊经得起人来人往，你给的偏爱是 \"我永远是你退路\"，而不是 \"你只能有我这一个出口\"。你把爱经营成了松弛，反而最让人离不开。\n\n🛠️ 给现实你的建议\n① 保持这份清醒，但别 \"懂事\" 过头 —— 偶尔也让对方知道你很在意她；② 下次她幸福时，除了祝福，也可以说一句 \"你开心，我也特别开心，但我也想你\"；③ 放心，你这种 \"站她这边但不捆绑她\" 的偏爱，是友情里最稀缺的珍贵。"

let currentQ = 0;
let answerList = [];
const totalQ = questionList.length;

function showPage(id) {
  document.querySelectorAll(".page-home,.page-question,.page-result").forEach(el=>el.style.display="none")
  document.getElementById(id).style.display="block";
}

// 页面加载读取历史结果
window.onload = function(){
  const saved = localStorage.getItem("friendTestData");
  if(saved){
    const resData = JSON.parse(saved);
    document.getElementById("resImg").src = resData.img;
    document.getElementById("resTitle").innerText = resData.title;
    document.getElementById("resDesc").innerText = resData.desc;
    showPage("pageResult");
  }else{
    showPage("pageHome");
  }
}

function startTest(){
  currentQ = 0;
  answerList = [];
  renderQuestion();
  showPage("pageQuestion");
}

function renderQuestion(){
  const q = questionList[currentQ];
  document.getElementById("qIndex").innerText = `第 ${currentQ+1} / ${totalQ} 题`;
  document.getElementById("qTitle").innerText = q.title;
  const box = document.getElementById("optionBox");
  box.innerHTML = "";
  document.getElementById("tipText").innerText = "";

  q.opt.forEach((item,idx)=>{
    const div = document.createElement("div");
    div.className = "option-item";
    div.innerText = item.t;
    div.onclick = ()=>{
      answerList[currentQ] = item.s;
      if(currentQ < totalQ -1){
        currentQ++;
        renderQuestion();
      }else{
        let totalScore = 0;
        answerList.forEach(s=>totalScore += s);
        let res = resultMap[resultMap.length-1];
        for(let r of resultMap){
          if(totalScore >= r.min && totalScore <= r.max){
            res = r;
            break;
          }
        }
        localStorage.setItem("friendTestData", JSON.stringify(res));
        document.getElementById("resImg").src = res.img;
        document.getElementById("resTitle").innerText = res.title;
        document.getElementById("resDesc").innerText = res.desc;
        showPage("pageResult");
      }
    }
    box.appendChild(div);
  })
}
</script>

</html>
